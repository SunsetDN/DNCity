# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Disabled: mods/ModernUI-MC's neoforge subproject builds with Architectury Loom (an outdated
# 1.7-SNAPSHOT release, since that's what its own upstream pins), whose own startup warning says
# "Loom support for the Gradle configuration cache is highly experimental and may not work as
# expected" -- confirmed true here: with the configuration cache on, Loom silently fails to apply
# its access transformer (META-INF/accesstransformer.cfg) to its local Minecraft artifact, so
# code depending on now-public members (e.g. OptionInstance.IntRangeBase) fails to compile with
# "not public ... cannot be accessed from outside package". `--no-configuration-cache` alone
# fixes it, but configuration cache is an invocation-wide setting shared by every included build,
# so it can't be scoped to just this one -- has to be off repo-wide.
org.gradle.configuration-cache=false
## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.21.1,1.22)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.248
# The Neo version range can use any version of Neo as bounds
neo_version_range=[21,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[5.3,)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20
## Mod Properties
# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=dncity
# The human-readable display name for the mod.
mod_name=DNCity
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GNU GPL 3.0
# The mod version. See https://semver.org/
mod_version=1.0-SNAPSHOT
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.jwyoon1220
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=
## Submodule mod versions
# Version of the TACZ submodule (mods/TACZ-1.21.1), used to resolve it via
# the composite build declared in settings.gradle. The included build's own
# version wins during dependency substitution, so this only needs to match
# closely enough for readability.
mods_tacz_version=1.1.8-hotfix-r6
# Version of the First Aid submodule (mods/First-Aid-New/neoforge1.21.1),
# resolved the same way via composite build substitution.
mods_firstaid_version=1.3.1-hotfix20181682026+neoforge1.21.1
# Version of the Automobility submodule (mods/Automobility), used to resolve its neoforge
# subproject via the composite build declared in settings.gradle.kts. Must match the version
# string Automobility's own subprojects{} block computes ("${mod_version}+${minecraft_version}-
# neoforge") closely enough for the included build's own version to win during substitution.
mods_automobility_version=0.5.0.h+1.21.1-neoforge
# Version of the SuperbWarfare submodule (mods/SuperbWarfare), resolved the same way via
# composite build substitution. Must match the version string SuperbWarfare's own build.gradle.kts
# computes ("${mod_version}-mc${minecraft_version}") closely enough for readability.
mods_superbwarfare_version=0.8.10-snapshot-mc1.21.1
