# AGENT-DONE(claude): feature-mods
# Expanded by this mod's generateModMetadata task (root build.gradle.kts, featureMods).
modLoader = "kotlinforforge"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "dncity"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Loaded after tacz/superbwarfare so our data (loot modifiers, recipe filters) comes after their own
[[dependencies."${mod_id}"]]
modId = "tacz"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "superbwarfare"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "firstaid"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
